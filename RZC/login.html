<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RZC — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="shoe" viewBox="0 0 220 120">
    <path class="shoe-upper" d="M18 88 C22 56 58 36 96 38 C120 39 134 50 148 62 C160 72 182 80 200 84 C208 86 210 90 208 92 L18 92 Z"/>
    <path class="shoe-accent" d="M58 86 C92 66 124 64 176 80 C140 80 108 82 78 88 Z"/>
    <path class="shoe-toe" d="M150 64 C162 73 184 80 200 84 C204 85 206 88 205 90 L150 90 Z"/>
    <path class="shoe-sole" d="M14 90 C9 106 24 110 36 110 L188 110 C204 110 210 100 207 92 L205 88 C206 92 200 94 188 94 L34 94 C24 94 17 93 16 89 Z"/>
    <path class="shoe-laces" d="M70 54 L94 47 M73 63 L99 55 M77 72 L104 63"/>
  </symbol>
  <symbol id="ic-cart" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM7.2 14h9.4c.7 0 1.3-.4 1.6-1l3.6-6.5-1.7-1L17.5 12H7.5L4.3 4H1v2h2l3.6 7.6-1.4 2.5C4.5 17.4 5.5 19 7.2 19h12v-2H7.2z"/></symbol>
  <symbol id="ic-search" viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></symbol>
  <symbol id="ic-user" viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4 0-9 2-9 6v2h18v-2c0-4-5-6-9-6z"/></symbol>
  <symbol id="ic-lock" viewBox="0 0 24 24"><path d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zm-6 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm3-9H9V6a3 3 0 0 1 6 0v2z"/></symbol>
</svg>
<main class="auth">
  <svg class="swirl swirl-left" viewBox="0 0 300 400" aria-hidden="true">
  <defs><linearGradient id="g-swirl-left" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e9e9e9"/><stop offset=".45" stop-color="#9a1c1d"/>
    <stop offset="1" stop-color="#3a0708"/></linearGradient></defs>
  <path fill="none" stroke="url(#g-swirl-left)" stroke-width="16" stroke-linecap="round"
    d="M40 30 C140 60 60 150 150 170 C250 190 120 270 200 300 C260 322 180 380 120 360"/>
  <path fill="none" stroke="url(#g-swirl-left)" stroke-width="9" stroke-linecap="round" opacity=".6"
    d="M70 60 C160 90 90 170 170 195 C250 220 140 290 210 320"/>
</svg>
  <svg class="swirl swirl-right" viewBox="0 0 300 400" aria-hidden="true">
  <defs><linearGradient id="g-swirl-right" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e9e9e9"/><stop offset=".45" stop-color="#9a1c1d"/>
    <stop offset="1" stop-color="#3a0708"/></linearGradient></defs>
  <path fill="none" stroke="url(#g-swirl-right)" stroke-width="16" stroke-linecap="round"
    d="M40 30 C140 60 60 150 150 170 C250 190 120 270 200 300 C260 322 180 380 120 360"/>
  <path fill="none" stroke="url(#g-swirl-right)" stroke-width="9" stroke-linecap="round" opacity=".6"
    d="M70 60 C160 90 90 170 170 195 C250 220 140 290 210 320"/>
</svg>
  <form class="auth-card" action="perfil.html">
    <div class="auth-brand">RZC</div>
    <h1>Log in</h1>
    <div class="auth-label">Username</div>
    <div class="input-icon"><svg><use href="#ic-user"/></svg><input placeholder="Username" aria-label="Username"></div>
    <div class="auth-label">Password</div>
    <div class="input-icon"><svg><use href="#ic-lock"/></svg><input type="password" placeholder="Password" aria-label="Password"></div>
    <div class="auth-options">
      <label><input type="checkbox"> Remember me</label>
      <a href="#">Forgot password?</a>
    </div>
    <button class="btn-dark" type="submit">Log in</button>
    <div class="auth-or">Or</div>
    <a href="cadastro.html"><button class="btn-dark btn-soft" type="button">Sign up</button></a>
  </form>
</main>
</body>
</html>
